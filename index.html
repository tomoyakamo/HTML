<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドキドキ💓菜々子さん</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --pink: #ff66b2; --light-pink: #ffe6f2; --bg: #fff0f5; --text: #4a4a4a; }
        body { font-family: 'Hiragino Sans', 'Meiryo', sans-serif; margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        .top-panel { height: 45%; background: white; display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 5px dotted var(--pink); padding: 10px; box-sizing: border-box; }
        .header { font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; color: var(--pink); text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        
        .controls { background: var(--light-pink); padding: 8px 20px; border-radius: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; border: 1px solid var(--pink); }
        label { font-size: 0.8rem; font-weight: bold; color: var(--pink); }
        select { background: white; color: var(--pink); border: 1px solid var(--pink); border-radius: 5px; padding: 5px; font-weight: bold; }

        .val-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 95%; max-width: 400px; }
        .axis-box { background: white; padding: 10px; border-radius: 15px; border: 2px solid var(--pink); box-shadow: 0 4px 0 var(--pink); }
        .axis-label { font-size: 0.8rem; color: var(--pink); font-weight: bold; margin-bottom: 5px; }
        .axis-num { font-size: 1.4rem; font-weight: bold; font-family: 'Courier New', monospace; color: #333; }
        
        #hz-tag { font-size: 0.8rem; color: #888; margin-top: 10px; font-weight: bold; }

        .bottom-panel { height: 55%; padding: 15px; box-sizing: border-box; background: white; }
        canvas { width: 100% !important; height: 100% !important; }

        #startBtn { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 25px 60px; font-size: 1.8rem; background: var(--pink); color: white; border: none; border-radius: 50px; cursor: pointer; z-index: 1000; box-shadow: 0 10px 0 #cc518e; font-weight: bold; }
    </style>
</head>
<body>

<button id="startBtn">菜々子さんを呼ぶ💓</button>

<div class="top-panel">
    <div class="header">ドキドキ💓菜々子さん</div>
    
    <div class="controls">
        <label>更新間隔:</label>
        <select id="speedSelect">
            <option value="100">0.1秒</option>
            <option value="200" selected>0.2秒</option>
            <option value="500">0.5秒</option>
            <option value="1000">1.0秒</option>
        </select>
    </div>

    <div class="val-grid">
        <div class="axis-box"><div class="axis-label">X軸 (G)</div><div id="x-val" class="axis-num">0.000</div></div>
        <div class="axis-box"><div class="axis-label">Y軸 (G)</div><div id="y-val" class="axis-num">0.000</div></div>
        <div class="axis-box"><div class="axis-label">Z軸 (G)</div><div id="z-val" class="axis-num">0.000</div></div>
    </div>
    <div id="hz-tag">サンプリング: -- Hz</div>
</div>

<div class="bottom-panel">
    <canvas id="psdChart"></canvas>
</div>

<script>
const SAMPLE_SIZE = 128; 
const G_CONSTANT = 9.80665;
let dataBuffer = new Array(SAMPLE_SIZE).fill(0);
let lastUpdate = performance.now();
let lastHzCalc = performance.now();
let frameCount = 0;
let samplingRate = 60;
let updateInterval = 200;

const ctx = document.getElementById('psdChart').getContext('2d');
const psdChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            data: [],
            borderColor: '#ff66b2',
            borderWidth: 3,
            pointRadius: 0,
            fill: true,
            backgroundColor: 'rgba(255, 102, 178, 0.1)',
            tension: 0.4
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { 
            x: { grid: { color: '#ffe6f2' }, ticks: { color: '#ff66b2' }, title: { display: true, text: '周波数 (Hz)', color: '#ff66b2' } },
            y: { grid: { color: '#ffe6f2' }, beginAtZero: true, suggestedMax: 0.4, ticks: { color: '#ff66b2' } }
        },
        animation: false,
        plugins: { legend: { display: false } }
    }
});

document.getElementById('speedSelect').addEventListener('change', (e) => {
    updateInterval = parseInt(e.target.value);
});

function handleMotion(event) {
    const acc = event.accelerationIncludingGravity;
    if (!acc) return;

    const norm = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2) / G_CONSTANT;
    dataBuffer.push(norm);
    dataBuffer.shift();

    document.getElementById('x-val').innerText = (acc.x / G_CONSTANT).toFixed(3);
    document.getElementById('y-val').innerText = (acc.y / G_CONSTANT).toFixed(3);
    document.getElementById('z-val').innerText = (acc.z / G_CONSTANT).toFixed(3);

    const now = performance.now();
    if (now - lastUpdate >= updateInterval) {
        updatePSD();
        lastUpdate = now;
    }

    frameCount++;
    if (now - lastHzCalc >= 1000) {
        document.getElementById('hz-tag').innerText = "サンプリング: " + ((frameCount * 1000) / (now - lastHzCalc)).toFixed(1) + " Hz";
        samplingRate = (frameCount * 1000) / (now - lastHzCalc);
        frameCount = 0;
        lastHzCalc = now;
    }
}

function updatePSD() {
    const N = SAMPLE_SIZE;
    const psdValues = [];
    const freqs = [];
    const avg = dataBuffer.reduce((a, b) => a + b) / N;
    const processedData = dataBuffer.map(v => v - avg);

    for (let k = 1; k < N / 2; k++) {
        let real = 0, imag = 0;
        for (let n = 0; n < N; n++) {
            const windowing = 0.5 * (1 - Math.cos(2 * Math.PI * n / (N - 1)));
            const angle = (2 * Math.PI * k * n) / N;
            real += processedData[n] * windowing * Math.cos(angle);
            imag -= processedData[n] * windowing * Math.sin(angle);
        }
        psdValues.push(Math.sqrt(real * real + imag * imag));
        freqs.push(((k * samplingRate) / N).toFixed(1));
    }

    psdChart.data.labels = freqs;
    psdChart.data.datasets[0].data = psdValues;
    psdChart.update('none');
}

document.getElementById('startBtn').addEventListener('click', async () => {
    try {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            const res = await DeviceMotionEvent.requestPermission();
            if (res === 'granted') window.addEventListener('devicemotion', handleMotion, true);
        } else {
            window.addEventListener('devicemotion', handleMotion, true);
        }
        document.getElementById('startBtn').style.display = 'none';
    } catch (e) {
        alert("エラーが発生しました: " + e);
    }
});
</script>
</body>
</html>
