<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibration Analyzer Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0f1115; --card: #1c1f26; --accent: #00ff41; --text: #e0e6ed; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 上部パネル：数値と設定 */
        .top-panel { height: 45%; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 2px solid #2d333d; padding: 10px; box-sizing: border-box; }
        .header { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
        
        .controls { background: rgba(255,255,255,0.05); padding: 8px 20px; border-radius: 20px; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        select { background: #2d333d; color: var(--accent); border: 1px solid #444; border-radius: 5px; padding: 5px; font-weight: bold; }

        .val-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; width: 90%; max-width: 400px; }
        .axis-box { background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; border-left: 3px solid var(--accent); }
        .axis-label { font-size: 0.7rem; color: #888; margin-bottom: 5px; }
        .axis-num { font-size: 1.6rem; font-weight: bold; font-family: 'Courier New', monospace; color: var(--accent); }
        
        #hz-tag { font-size: 0.8rem; color: #888; margin-top: 10px; }

        /* 下部パネル：グラフ */
        .bottom-panel { height: 55%; padding: 15px; box-sizing: border-box; }
        canvas { width: 100% !important; height: 100% !important; }

        #startBtn { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 50px; font-size: 1.4rem; background: #007bff; color: white; border: none; border-radius: 40px; cursor: pointer; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); font-weight: bold; }
    </style>
</head>
<body>

<button id="startBtn">START ANALYSIS</button>

<div class="top-panel">
    <div class="header">Vibration Monitor</div>
    
    <div class="controls">
        <label style="font-size:0.8rem">REFRESH RATE:</label>
        <select id="speedSelect">
            <option value="100">0.1s (Ultra)</option>
            <option value="200" selected>0.2s (Smooth)</option>
            <option value="500">0.5s (Steady)</option>
            <option value="1000">1.0s (Fixed)</option>
        </select>
    </div>

    <div class="val-grid">
        <div class="axis-box"><div class="axis-label">X-AXIS</div><div id="x-val" class="axis-num">0.000</div></div>
        <div class="axis-box"><div class="axis-label">Y-AXIS</div><div id="y-val" class="axis-num">0.000</div></div>
        <div class="axis-box"><div class="axis-label">Z-AXIS</div><div id="z-val" class="axis-num">0.000</div></div>
    </div>
    <div id="hz-tag">Sampling: -- Hz</div>
</div>

<div class="bottom-panel">
    <canvas id="psdChart"></canvas>
</div>

<script>
const SAMPLE_SIZE = 128; 
const G_CONSTANT = 9.80665;
let dataBuffer = new Array(SAMPLE_SIZE).fill(0);
let lastUpdate = performance.now();
let lastHzCalc = performance.now();
let frameCount = 0;
let samplingRate = 60;
let updateInterval = 200;

const ctx = document.getElementById('psdChart').getContext('2d');
const psdChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: [],
        datasets: [{
            data: [],
            borderColor: '#00ff41',
            borderWidth: 2,
            pointRadius: 0,
            fill: true,
            backgroundColor: 'rgba(0, 255, 65, 0.05)'
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { 
            x: { grid: { color: '#2d333d' }, ticks: { color: '#666', font: { size: 10 } }, title: { display: true, text: 'Frequency (Hz)', color: '#444' } },
            y: { grid: { color: '#2d333d' }, beginAtZero: true, suggestedMax: 0.4, ticks: { color: '#666' } }
        },
        animation: false,
        plugins: { legend: { display: false } }
    }
});

document.getElementById('speedSelect').addEventListener('change', (e) => {
    updateInterval = parseInt(e.target.value);
});

function handleMotion(event) {
    const acc = event.accelerationIncludingGravity;
    if (!acc) return;

    // 合成加速度の計算
    const norm = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2) / G_CONSTANT;
    dataBuffer.push(norm);
    dataBuffer.shift();

    // 数値表示
    document.getElementById('x-val').innerText = (acc.x / G_CONSTANT).toFixed(3);
    document.getElementById('y-val').innerText = (acc.y / G_CONSTANT).toFixed(3);
    document.getElementById('z-val').innerText = (acc.z / G_CONSTANT).toFixed(3);

    const now = performance.now();
    if (now - lastUpdate >= updateInterval) {
        updatePSD();
        lastUpdate = now;
    }

    frameCount++;
    if (now - lastHzCalc >= 1000) {
        document.getElementById('hz-tag').innerText = "Sampling: " + ((frameCount * 1000) / (now - lastHzCalc)).toFixed(1) + " Hz";
        samplingRate = (frameCount * 1000) / (now - lastHzCalc);
        frameCount = 0;
        lastHzCalc = now;
    }
}

function updatePSD() {
    const N = SAMPLE_SIZE;
    const psdValues = [];
    const freqs = [];
    const avg = dataBuffer.reduce((a, b) => a + b) / N;
    const processedData = dataBuffer.map(v => v - avg);

    for (let k = 1; k < N / 2; k++) {
        let real = 0, imag = 0;
        for (let n = 0; n < N; n++) {
            const windowing = 0.5 * (1 - Math.cos(2 * Math.PI * n / (N - 1)));
            const angle = (2 * Math.PI * k * n) / N;
            real += processedData[n] * windowing * Math.cos(angle);
            imag -= processedData[n] * windowing * Math.sin(angle);
        }
        psdValues.push(Math.sqrt(real * real + imag * imag));
        freqs.push(((k * samplingRate) / N).toFixed(1));
    }

    psdChart.data.labels = freqs;
    psdChart.data.datasets[0].data = psdValues;
    psdChart.update('none');
}

document.getElementById('startBtn').addEventListener('click', async () => {
    try {
        if (typeof DeviceMotionEvent.requestPermission === 'function') {
            const res = await DeviceMotionEvent.requestPermission();
            if (res === 'granted') window.addEventListener('devicemotion', handleMotion, true);
        } else {
            window.addEventListener('devicemotion', handleMotion, true);
        }
        document.getElementById('startBtn').style.display = 'none';
    } catch (e) {
        alert("Sensor error: " + e);
    }
});
</script>
</body>
</html>
