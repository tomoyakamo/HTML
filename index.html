<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Speed Vibration Analyzer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #121212; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .top-panel { height: 35%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #1e1e1e; border-bottom: 1px solid #333; }
        .bottom-panel { height: 65%; padding: 10px; box-sizing: border-box; background: #121212; }
        .val-display { display: flex; gap: 25px; margin-top: 10px; }
        .axis-val { text-align: center; }
        .label { font-size: 0.8rem; color: #aaa; }
        .num { font-size: 1.6rem; font-weight: bold; font-family: 'Courier New', monospace; color: #00ff41; }
        #hz-tag { background: #333; padding: 2px 10px; border-radius: 10px; font-size: 0.8rem; color: #00ff41; margin-bottom: 5px; }
        canvas { width: 100% !important; height: 100% !important; }
        #startBtn { padding: 18px 45px; font-size: 1.3rem; background: #007bff; color: white; border: none; border-radius: 35px; cursor: pointer; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<button id="startBtn">計測開始（高感度モード）</button>

<div class="top-panel">
    <div id="hz-tag">Waiting...</div>
    <div class="val-display">
        <div class="axis-val"><div class="label">X</div><div id="x-val" class="num">0.000</div></div>
        <div class="axis-val"><div class="label">Y</div><div id="y-val" class="num">0.000</div></div>
        <div class="axis-val"><div class="label">Z</div><div id="z-val" class="num">0.000</div></div>
    </div>
    <p style="font-size: 0.7rem; color: #888; margin-top: 10px;">※XYZ合成加速度(G)の周波数を解析中</p>
</div>

<div class="bottom-panel">
    <canvas id="psdChart"></canvas>
</div>

<script>
const SAMPLE_SIZE = 128; 
const G_CONSTANT = 9.80665;
let dataBuffer = new Array(SAMPLE_SIZE).fill(0);
let lastUpdate = performance.now();
let lastHzCalc = performance.now();
let frameCount = 0;
let samplingRate = 60;

const ctx = document.getElementById('psdChart').getContext('2d');
const psdChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: new Array(SAMPLE_SIZE / 2).fill(0),
        datasets: [{
            label: '振動強度 (PSD)',
            data: [],
            borderColor: '#00ff41',
            borderWidth: 1.5,
            pointRadius: 0,
            fill: true,
            backgroundColor: 'rgba(0, 255, 65, 0.1)'
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: { 
            x: { grid: { color: '#333' }, title: { display: true, text: '周波数 (Hz)', color: '#888' }, ticks: { color: '#888' } },
            y: { grid: { color: '#333' }, beginAtZero: true, title: { display: true, text: '強度', color: '#888' }, ticks: { color: '#888' } }
        },
        animation: false,
        plugins: { legend: { display: false } }
    }
});

function handleMotion(event) {
    const acc = event.accelerationIncludingGravity;
    if (!acc) return;

    // XYZの合成加速度を計算（どの方向の振動も逃さない）
    const norm = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2) / G_CONSTANT;
    
    // 直近の重力影響を引く（簡易的なDC成分除去）
    dataBuffer.push(norm);
    dataBuffer.shift();

    // 画面の数値更新（ここは毎フレーム）
    document.getElementById('x-val').innerText = (acc.x / G_CONSTANT).toFixed(3);
    document.getElementById('y-val').innerText = (acc.y / G_CONSTANT).toFixed(3);
    document.getElementById('z-val').innerText = (acc.z / G_CONSTANT).toFixed(3);

    const now = performance.now();

    // 0.1秒(100ms)ごとにグラフを更新
    if (now - lastUpdate >= 100) {
        updatePSD();
        lastUpdate = now;
    }

    // サンプリングレート計測
    frameCount++;
    if (now - lastHzCalc >= 1000) {
        samplingRate = (frameCount * 1000) / (now - lastHzCalc);
        document.getElementById('hz-tag').innerText = samplingRate.toFixed(1) + " Hz";
        frameCount = 0;
        lastHzCalc = now;
    }
}

function updatePSD() {
    const N = SAMPLE_SIZE;
    const psdValues = [];
    const freqs = [];
    
    // 直流成分（重力）を簡易除去するために平均を引く
    const avg = dataBuffer.reduce((a, b) => a + b) / N;
    const processedData = dataBuffer.map(v => v - avg);

    for (let k = 1; k < N / 2; k++) { // k=0(直流)はスキップ
        let real = 0, imag = 0;
        for (let n = 0; n < N; n++) {
            const windowing = 0.5 * (1 - Math.cos(2 * Math.PI * n / (N - 1))); // Hann窓
            const angle = (2 * Math.PI * k * n) / N;
            real += processedData[n] * windowing * Math.cos(angle);
            imag -= processedData[n] * windowing * Math.sin(angle);
        }
        psdValues.push(Math.sqrt(real * real + imag * imag));
        freqs.push(((k * samplingRate) / N).toFixed(1));
    }

    psdChart.data.labels = freqs;
    psdChart.data.datasets[0].data = psdValues;
    psdChart.update('none'); // アニメーションなしで高速描画
}

document.getElementById('startBtn').addEventListener('click', async () => {
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
        const res = await DeviceMotionEvent.requestPermission();
        if (res === 'granted') window.addEventListener('devicemotion', handleMotion, true);
    } else {
        window.addEventListener('devicemotion', handleMotion, true);
    }
    document.getElementById('startBtn').style.display = 'none';
});
</script>
</body>
</html>
